<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centro de Monitoreo – Las Toscas</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/logo.svg" alt="">
        <div class="brand-txt"><strong>Centro de Monitoreo</strong><span>Municipalidad de Las Toscas</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot"><div class="sys-status" id="sys-status"></div></div>
    </aside>
    <div class="backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Abrir menú"></button>
        <div class="grow">
          <h1 id="page-title">Mapa en vivo</h1>
          <div class="crumb">Las Toscas, Santa Fe · <span class="tag tag-sim" style="font-size:10px;padding:0 6px">Demo · datos simulados</span></div>
        </div>
        <div class="clock" id="clock"></div>
        <button class="icon-btn" id="mute" aria-label="Sonido"></button>
        <button class="icon-btn" id="bell" aria-label="Alertas" title="Alertas y casos"><span class="badge-dot hidden" id="bell-badge"></span></button>
        <div class="user-chip" id="user-chip"></div>
        <button class="icon-btn" id="logout" aria-label="Cerrar sesión" title="Cerrar sesión"></button>
      </header>

      <main class="content">
        <section class="section full map-sec" id="sec-mapa">
          <div id="map-op"></div>
          <div class="map-toolbar">
            <button class="btn btn-sos btn-sm" id="tb-sos"></button>
            <button class="btn btn-warn btn-sm" id="tb-vecino"></button>
            <button class="btn btn-violet btn-sm" id="tb-ia"></button>
            <button class="btn btn-sm" id="tb-inc"></button>
          </div>
          <div class="sim-chip" id="sim-chip"></div>
        </section>
        <section class="section full map-sec" id="sec-historico"></section>
        <section class="section" id="sec-camaras"></section>
        <section class="section" id="sec-alertas"></section>
        <section class="section" id="sec-flota"></section>
        <section class="section" id="sec-incidentes"></section>
        <section class="section full split-sec" id="sec-rutas"></section>
        <section class="section" id="sec-estadisticas"></section>
        <section class="section" id="sec-analisis"></section>
        <section class="section" id="sec-hoja"></section>
      </main>
    </div>
  </div>
  <div id="print-report"></div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" crossorigin="anonymous"></script>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/history.js"></script>
  <script src="js/patrols.js"></script>
  <script src="js/cameras.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/sos.js"></script>
  <script src="js/routes.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/sections.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
